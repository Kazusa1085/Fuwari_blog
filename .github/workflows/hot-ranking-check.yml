name: Check Hot Ranking Changes

on:
  schedule:
    - cron: '0 16 * * *' # UTC 16:00 = Beijing 00:00
  workflow_dispatch:

concurrency:
  group: hot-ranking-check-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Posts live in the separate public Blog_Archive repository. The old
      # shell version read content/posts/*.md without syncing it first, so it
      # always produced an empty list; sync the content explicitly instead.
      - name: Sync content from Blog_Archive
        env:
          ENABLE_CONTENT_SYNC: "true"
          CONTENT_REPO_URL: "https://github.com/Kazusa1085/Blog_Archive.git"
        run: node scripts/sync-content.js

      - name: Update hot ranking data
        id: update
        run: node scripts/update-hot-ranking.mjs

      - name: Commit and push when the top 5 changed
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/post-views.json .hot-ranking-cache.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update post views data"
          git pull --rebase origin main
          git push origin HEAD:main
