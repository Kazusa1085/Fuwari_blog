name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Astro check & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The post/friend/project content lives in a separate public repository.
      # Pull it so checks and the build run against real content, not an empty folder.
      - name: Sync content from Blog_Archive
        run: git clone --depth 1 https://github.com/Kazusa1085/Blog_Archive.git content

      - name: Astro check
        run: pnpm astro check

      - name: Type check
        run: pnpm run type-check

      - name: Biome check
        run: pnpm exec biome check ./src

      - name: Build
        run: |
          ENABLE_CONTENT_SYNC=false pnpm build
