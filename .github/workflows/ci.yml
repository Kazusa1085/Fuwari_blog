name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Astro check & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Astro check / type-check / Biome 目前仍有存量错误和格式化问题，
      # 暂不纳入 CI，等后续代码清理完成后可再加回来。这里先保证每次构建成功。
      - name: Build
        run: |
          ENABLE_CONTENT_SYNC=false pnpm build
